name: Monorepo CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Monorepo Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify monorepo
        run: bash ./scripts/verify_all.sh ci

  e2e:
    name: Browser Journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iterview
          POSTGRES_USER: iterview
          POSTGRES_PASSWORD: iterview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iterview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/iterview
      DB_USERNAME: iterview
      DB_PASSWORD: iterview
      AUTH_TOKEN_SECRET: ci-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        working-directory: apps/web
        run: |
          npm ci
          echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"

      # The journeys run headless, so only Chromium's headless shell is needed. ubuntu-latest
      # already ships the libraries it links against (it has Google Chrome installed), so the
      # slow apt step of `--with-deps` is skipped unless the shell cannot start.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-shell

      - name: Install Chromium headless shell
        working-directory: apps/web
        run: |
          npx playwright install --only-shell chromium
          SHELL_BIN="$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell | head -1)"
          if ldd "$SHELL_BIN" | grep -q "not found"; then
            echo "Missing system libraries for Chromium; installing them."
            npx playwright install-deps chromium
          fi

      - name: Run browser journeys
        run: bash ./scripts/e2e.sh --start

      - name: Keep the report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
