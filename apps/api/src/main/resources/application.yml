spring:
  profiles:
    default: local
  application:
    name: iterview-api
  servlet:
    multipart:
      # Must be at least as large as the largest domain-specific upload cap.
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:55MB}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:25s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  # The day boundary for daily cards (ADR 0085).
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  rate-limits:
    login:
      max-attempts: ${APP_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
    # Per user, per hour (ADR 0090). 0 turns a limit off.
    upload:
      max-requests: ${APP_RATE_LIMIT_UPLOAD_MAX_REQUESTS:20}
      window-seconds: ${APP_RATE_LIMIT_UPLOAD_WINDOW_SECONDS:3600}
    generation:
      max-requests: ${APP_RATE_LIMIT_GENERATION_MAX_REQUESTS:120}
      window-seconds: ${APP_RATE_LIMIT_GENERATION_WINDOW_SECONDS:3600}

auth:
  token:
    ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:86400}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:false}
