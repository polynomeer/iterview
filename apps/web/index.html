<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="이력서 한 줄 한 줄과 이어지는 꼬리질문까지 대비하는 면접 준비 서비스"
    />
    <title>이터뷰 | 이력서 기반 면접 준비</title>
    <script>
      // Apply the stored theme before React mounts so a reload never flashes the other palette (ADR 0082).
      (() => {
        const stored = window.localStorage.getItem("iterview-theme");
        const retired = { workspace: "dark", dracula: "dark" };
        const theme = stored === "system" || stored === "light" || stored === "dark" ? stored : retired[stored] || "system";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
