<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="이력서를 깊이 이해하고 꼬리질문까지 DFS 방식으로 대비하는 면접 준비 워크스페이스"
    />
    <title>이터뷰 | 이력서 기반 면접 준비</title>
    <script>
      (() => {
        const themeStorageKey = "iterview-theme";
        const defaultTheme = "workspace";
        const storedTheme = window.localStorage.getItem(themeStorageKey);
        const nextTheme =
          storedTheme === "dark" || storedTheme === "workspace" || storedTheme === "dracula"
            ? storedTheme
            : defaultTheme;

        document.documentElement.dataset.theme = nextTheme;
        document.documentElement.style.colorScheme = "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
