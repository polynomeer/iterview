name: iterview

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iterview}
      POSTGRES_USER: ${POSTGRES_USER:-iterview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iterview}
    volumes:
      - iterview-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iterview} -d ${POSTGRES_DB:-iterview}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: gradle:8.10.2-jdk21
    restart: unless-stopped
    working_dir: /workspace/apps/api
    command: ./gradlew bootRun --no-daemon
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iterview}
      DB_USERNAME: ${POSTGRES_USER:-iterview}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iterview}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-only-secret-change-me}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      GRADLE_USER_HOME: /home/gradle/.gradle
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    stop_grace_period: 30s
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - iterview-gradle-cache:/home/gradle/.gradle

  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /workspace/apps/web
    command:
      - sh
      - -lc
      - |
        # Reinstall whenever the lockfile changes, not only into an empty volume.
        lock_hash="$$(md5sum package-lock.json | cut -d' ' -f1)"
        if [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$lock_hash" ]; then
          npm install --no-audit --no-fund && echo "$$lock_hash" > node_modules/.lock-hash
        fi
        npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      API_PROXY_TARGET: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - iterview-web-node-modules:/workspace/apps/web/node_modules

volumes:
  iterview-postgres-data:
  iterview-gradle-cache:
  iterview-web-node-modules:
